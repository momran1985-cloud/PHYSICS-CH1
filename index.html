<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة اختبارات تحصيلي الفيزياء</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g1:#14532d;--g2:#15803d;--g3:#22c55e;--g4:#dcfce7;--g5:#f0fdf4;
  --gold:#f59e0b;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bad:#dc2626;--bad-bg:#fee2e2;--ok-bg:#dcfce7;
  --card:#ffffff;--bg:#f1f5f9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#ecfdf5 0,#f1f5f9 320px);color:var(--ink);line-height:1.75;min-height:100vh}
button,input,select{font-family:inherit;font-size:1rem}
.wrap{max-width:920px;margin:0 auto;padding:16px}
.m{unicode-bidi:isolate;direction:ltr;display:inline-block;font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-weight:600}
sup{font-size:.7em;line-height:0}

/* header */
.top{background:var(--g1);color:#fff;border-bottom:4px solid var(--gold)}
.top .in{max-width:920px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:var(--g3);display:grid;place-items:center;font-size:1.5rem}
.brand b{display:block;font-size:1.1rem;font-weight:800}
.brand small{opacity:.85}
.userbox{display:flex;align-items:center;gap:10px;font-size:.92rem}
.linkbtn{background:rgba(255,255,255,.14);color:#fff;border:0;padding:6px 12px;border-radius:10px;cursor:pointer}
.linkbtn:hover{background:rgba(255,255,255,.25)}

/* login */
.login{max-width:480px;margin:40px auto;background:var(--card);border-radius:20px;box-shadow:0 10px 30px rgba(15,23,42,.12);overflow:hidden}
.login .head{background:var(--g1);color:#fff;padding:24px;text-align:center}
.login .head h1{margin:6px 0 2px;font-size:1.4rem}
.login form{padding:22px;display:grid;gap:14px}
label{font-weight:700;display:block;margin-bottom:4px}
input[type=text],select{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
input[type=text]:focus,select:focus{outline:0;border-color:var(--g3)}
.btn{background:var(--g2);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{background:var(--g1)}
.btn.alt{background:#fff;color:var(--g1);border:2px solid var(--g2)}
.btn.alt:hover{background:var(--g5)}
.btn.gold{background:var(--gold);color:#422006}
.btn.gold:hover{background:#d97706;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--bad);font-weight:700;min-height:1.4em}

/* home */
.hero{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 4px 16px rgba(15,23,42,.07);margin:8px 0 18px}
.hero h2{margin:0 0 4px;font-size:1.35rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--g5);border:1px solid var(--g4);border-radius:14px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:1.5rem;color:var(--g1)}
.stat span{color:var(--mut);font-size:.85rem}
.pbar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--g3),var(--g2));border-radius:99px;transition:width .4s}
.opt-row{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--mut);font-size:.93rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 4px 16px rgba(15,23,42,.07);border:2px solid transparent;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--g3)}
.card .ic{font-size:2rem}
.card .no{color:var(--g2);font-weight:800;font-size:.9rem}
.card h3{margin:0;font-size:1.15rem}
.card p{margin:0;color:var(--mut);font-size:.93rem;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--g4);color:var(--g1);border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700}
.chip.gold{background:#fef3c7;color:#92400e}
.chip.gray{background:#e2e8f0;color:#475569}
.card.final{background:linear-gradient(135deg,#14532d,#166534);color:#fff;grid-column:1/-1}
.card.final p,.card.final .no{color:#bbf7d0}
.card.final .chip{background:rgba(255,255,255,.18);color:#fff}
.card.final .btn{background:var(--gold);color:#422006}

/* quiz */
.qhead{background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:0 4px 14px rgba(15,23,42,.07);margin:10px 0}
.qhead .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qhead b{color:var(--g1)}
.timer{background:var(--g4);color:var(--g1);border-radius:10px;padding:2px 12px;font-weight:800;direction:ltr;display:inline-block}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.qcard{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 4px 16px rgba(15,23,42,.07)}
.qnum{color:var(--g2);font-weight:800;margin-bottom:4px}
.qtext{font-size:1.2rem;font-weight:700;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;width:100%;transition:.12s;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--g3);background:var(--g5)}
.opt .lt{width:34px;height:34px;border-radius:50%;background:var(--g4);color:var(--g1);display:grid;place-items:center;font-weight:800;flex:none}
.opt .ot{flex:1;font-size:1.05rem}
.opt.sel{border-color:var(--g2);background:var(--g5)}
.opt.sel .lt{background:var(--g2);color:#fff}
.opt.ok{border-color:var(--g2);background:var(--ok-bg)}
.opt.ok .lt{background:var(--g2);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .lt{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;border-right:6px solid}
.fb.good{background:var(--ok-bg);border-color:var(--g2)}
.fb.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.qgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.qgrid button{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:700}
.qgrid button.done{background:var(--g4);border-color:var(--g3)}
.qgrid button.cur{border-color:var(--g1);background:var(--g1);color:#fff}
.warn{background:#fef3c7;border:1px solid #fcd34d;color:#92400e;border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:700}

/* result */
.res{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 4px 16px rgba(15,23,42,.07);text-align:center;margin-top:10px}
.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:8px auto;display:grid;place-items:center;background:conic-gradient(var(--g2) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:2rem;font-weight:800;color:var(--g1);direction:ltr}
.res h2{margin:6px 0}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;text-align:right}
details.bad{border-color:#fca5a5;background:#fff7f7}
details.good{border-color:#86efac}
summary{cursor:pointer;font-weight:700}
.rv{margin-top:8px;font-size:.97rem}
.rv .yours{color:var(--bad);font-weight:700}
.rv .right{color:var(--g2);font-weight:700}

/* certificate */
.cert{background:#fff;border:8px double var(--g1);border-radius:10px;padding:36px 24px;text-align:center;margin:16px auto;max-width:760px}
.cert h1{color:var(--g1);margin:0;font-size:2rem}
.cert .nm{font-size:1.9rem;font-weight:800;color:var(--g2);margin:10px 0;border-bottom:2px dashed var(--g3);display:inline-block;padding:0 28px}
.cert .sig{display:flex;justify-content:space-around;margin-top:30px;font-weight:700}

.foot{text-align:center;color:var(--mut);font-size:.88rem;padding:24px 12px}
.foot b{color:var(--g1)}
@media(max-width:560px){.qtext{font-size:1.08rem}.wrap{padding:12px}.cert h1{font-size:1.5rem}}
@media print{
  body{background:#fff}
  .no-print,.top,.foot{display:none!important}
  .cert{border-width:8px;margin:0 auto}
}
</style>
</head>

s3: [
["أي الكميات التالية كمية قياسية؟","الكتلة","القوة","الإزاحة","التسارع","الكمية القياسية يكفي لتحديدها مقدار ووحدة دون اتجاه، مثل الكتلة والزمن والطاقة."],

/* ---------- أدوات ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(s){return s.replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/\$([^$]+)\$/g,'<bdi class="m" dir="ltr">$1</bdi>');}
function plain(s){return s.replace(/\^\{([^}]*)\}/g,'^$1').replace(/\$/g,'');}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function mmss(n){n=Math.max(0,n);var m=Math.floor(n/60),s=n%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function secOf(id){return SECTIONS.filter(function(s){return s.id===id;})[0];}

var db={user:null,prog:{},pts:0,shuffle:false};

var S=null,timerId=null;

/* ---------- الهيكل ---------- */

  (db.user?'<div class="userbox"><span>👤 '+esc(db.user.name)+'</span><button class="linkbtn" data-act="logout">خروج</button></div>':'')+'</div></header>';
}

function page(html){app.innerHTML=header()+html+footer();window.scrollTo(0,0);}

/* ---------- تسجيل الدخول ---------- */

  app.innerHTML=header()+'<div class="login"><div class="head"><div style="font-size:2.4rem">⚡</div><h1>منصة اختبارات تحصيلي الفيزياء</h1><div>'+esc(TEACHER)+'</div></div>'+
  '<form id="loginForm" autocomplete="off"><div><label for="ph">رقم الدخول (رقم الجوال)</label><input id="ph" type="text" inputmode="numeric" dir="ltr" placeholder="05XXXXXXXX" style="text-align:right"></div><div><label for="nm">الاسم الثلاثي</label><input id="nm" type="text" placeholder="مثال: أحمد محمد علي"></div>'+
  '<div class="err" id="err"></div><button class="btn" type="submit">ابدأ التدريب ←</button></form></div>'+footer();
}

/* ---------- الصفحة الرئيسية ---------- */
function totalQ(){return SECTIONS.reduce(function(a,s){return a+s.qs.length;},0);}
function home(){
  stopTimer();S=null;
  var done=SECTIONS.filter(function(s){return db.prog[s.id]&&db.prog[s.id].best>=60;}).length;
  var attempts=0;SECTIONS.forEach(function(s){if(db.prog[s.id])attempts+=db.prog[s.id].attempts;});
  var pct=Math.round(done/SECTIONS.length*100);
  var cards=SECTIONS.map(function(s){
    var p=db.prog[s.id];
    var chips='<span class="chip">'+s.qs.length+' سؤالًا</span>'+(s.exam?'<span class="chip">⏱ '+(s.time/60)+' دقيقة</span>':'<span class="chip">تغذية راجعة فورية</span>');
    if(p){chips+='<span class="chip '+(p.best>=60?'gold':'gray')+'">أفضل نتيجة '+p.best+'%</span>';if(p.best>=80)chips+='<span class="chip gold">🏅 وسام التميز</span>';}
    return '<article class="card'+(s.exam?' final':'')+'"><div class="ic">'+s.ic+'</div><div class="no">'+s.no+'</div><h3>'+s.title+'</h3><p>'+s.desc+'</p><div class="chips">'+chips+'</div>'+
      '<div><button class="btn" data-act="start" data-v="'+s.id+'">'+(p?'إعادة الاختبار':'ابدأ الاختبار')+'</button></div></article>';
  }).join('');
  page('<main class="wrap"><section class="hero"><h2>مرحبًا '+esc(db.user.name)+' 👋</h2><div style="color:var(--mut)">اختر قسمًا وابدأ التدريب. اجتز كل قسم بنسبة 60% فأكثر ثم اختبر نفسك في الاختبار النهائي.</div>'+
   '<div class="stats"><div class="stat"><b>'+done+' / '+SECTIONS.length+'</b><span>اختبارات مُجتازة</span></div><div class="stat"><b>'+db.pts+'</b><span>مجموع النقاط</span></div><div class="stat"><b>'+attempts+'</b><span>عدد المحاولات</span></div><div class="stat"><b>'+totalQ()+'</b><span>سؤالًا في المنصة</span></div></div>'+
   '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
   '<div style="margin-top:10px">درجة الإنجاز الكلية: <b style="color:var(--g1)">'+achievement()+'%</b> <span class="chip">'+level(achievement())+'</span></div>'+
   '<div class="acts" style="justify-content:flex-start"><button class="btn gold" data-act="mailall">📧 إرسال تقرير الإنجاز للمعلم</button><button class="btn alt" data-act="copyall">📋 نسخ التقرير</button></div>'+
   '<label class="opt-row"><input type="checkbox" id="shuf" '+(db.shuffle?'checked':'')+'> ترتيب أسئلة الأقسام عشوائيًا (الاختبار النهائي عشوائي دائمًا)</label></section>'+
   '<div class="grid">'+cards+'</div></main>');
}

/* ---------- الاختبار ---------- */
function prep(sec){
  var list=sec.qs.map(function(r,i){
    var o=[0,1,2,3].map(function(k){return {t:r[k+1],ok:k===0};});
    shuffle(o);
    return {q:r[0],o:o,ex:r[5],n:i+1};
  });
  if(sec.exam||db.shuffle)shuffle(list);
  return list;
}
function startQuiz(id){
  var sec=secOf(id);
  S={sec:sec,list:prep(sec),idx:0,mode:sec.exam?'exam':'practice',t0:Date.now(),qt:Date.now(),pts:0,warned:false,ended:false};
  S.ans=S.list.map(function(){return null;});
  S.gain=S.list.map(function(){return 0;});
  stopTimer();timerId=setInterval(tick,1000);
  quiz();
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function tick(){
  if(!S||S.ended)return;
  var el=document.getElementById('timer');
  var el2=Math.floor((Date.now()-S.t0)/1000);
  if(S.sec.time){
    var left=S.sec.time-el2;
    if(el){el.textContent=mmss(left);el.className='timer'+(left<=300?' low':'');}
    if(left<=0)finish(true);
  }else if(el){el.textContent=mmss(el2);}
}
function quiz(){
  var q=S.list[S.idx],a=S.ans[S.idx],n=S.list.length,exam=S.mode==='exam';
  var locked=!exam&&a!==null;
  var answered=S.ans.filter(function(x){return x!==null;}).length;
  var opts=q.o.map(function(o,k){
    var cls='opt',mark='';
    if(exam){if(a===k)cls+=' sel';}
    else if(locked){if(o.ok){cls+=' ok';mark='<span>✅</span>';}else if(a===k){cls+=' bad';mark='<span>❌</span>';}else cls+=' dim';}
    return '<button class="'+cls+'" data-act="pick" data-v="'+k+'"'+(locked?' disabled':'')+'><span class="lt">'+L[k]+'</span><span class="ot">'+fmt(o.t)+'</span>'+mark+'</button>';
  }).join('');
  var fb='';
  if(locked){
    var good=q.o[a].ok;
    fb='<div class="fb '+(good?'good':'wrong')+'"><b>'+(good?'إجابة صحيحة 🎉 (+'+S.gain[S.idx]+' نقطة)':'إجابة غير صحيحة')+'</b>'+fmt(q.ex)+'</div>';
  }
  var nav='';
  if(exam){
    var grid=S.list.map(function(_,i){return '<button class="'+(i===S.idx?'cur':(S.ans[i]!==null?'done':''))+'" data-act="goto" data-v="'+i+'">'+(i+1)+'</button>';}).join('');
    var unans=n-answered;
    nav='<div class="nav"><button class="btn alt" data-act="prev"'+(S.idx===0?' disabled':'')+'>→ السابق</button>'+
        '<button class="btn gold" data-act="finish">إنهاء الاختبار</button>'+
        '<button class="btn alt" data-act="next"'+(S.idx===n-1?' disabled':'')+'>التالي ←</button></div>'+
        (S.warned&&unans>0?'<div class="warn">لديك '+unans+' سؤال بلا إجابة. اضغط «إنهاء الاختبار» مرة أخرى للتأكيد، أو أكمل الإجابة.</div>':'')+
        '<div class="qgrid">'+grid+'</div>';
  }else{
    nav='<div class="nav"><span></span>'+(locked?'<button class="btn" data-act="'+(S.idx===n-1?'finish':'next')+'">'+(S.idx===n-1?'عرض النتيجة 🏁':'السؤال التالي ←')+'</button>':'<span style="color:var(--mut)">اختر إجابتك</span>')+'</div>';
  }
  var elapsed=Math.floor((Date.now()-S.t0)/1000);
  var timerTxt=S.sec.time?mmss(S.sec.time-elapsed):mmss(elapsed);
  page('<main class="wrap"><div class="qhead"><div class="row"><b>'+S.sec.ic+' '+S.sec.title+'</b><span>⏱ <span class="timer" id="timer">'+timerTxt+'</span></span><span>النقاط: <b>'+S.pts+'</b></span></div>'+
    '<div class="pbar"><i style="width:'+Math.round((exam?answered:S.idx+(locked?1:0))/n*100)+'%"></i></div></div>'+
    '<div class="qcard"><div class="qnum">السؤال '+(S.idx+1)+' من '+n+'</div><div class="qtext">'+fmt(q.q)+'</div><div class="opts">'+opts+'</div>'+fb+nav+'</div>'+
    '<div class="acts no-print"><button class="btn alt" data-act="home">← الرجوع للرئيسية</button></div></main>');
  S.qt=Date.now();
}
function pick(k){
  if(!S||S.ended)return;
  var q=S.list[S.idx];
  if(S.mode==='exam'){S.ans[S.idx]=k;S.warned=false;quiz();return;}
  if(S.ans[S.idx]!==null)return;
  S.ans[S.idx]=k;
  if(q.o[k].ok){
    var sec=(Date.now()-S.qt)/1000;
    var g=10+(sec<10?5:(sec<20?3:0));
    S.gain[S.idx]=g;S.pts+=g;
  }
  quiz();
}
function finish(auto){
  if(!S||S.ended)return;
  var n=S.list.length;
  var unans=S.ans.filter(function(x){return x===null;}).length;
  if(!auto&&S.mode==='exam'&&unans>0&&!S.warned){S.warned=true;quiz();return;}
  S.ended=true;stopTimer();
  var correct=0;
  S.list.forEach(function(q,i){if(S.ans[i]!==null&&q.o[S.ans[i]].ok)correct++;});
  var pct=Math.round(correct/n*100);
  var earned=S.mode==='exam'?correct*10:S.pts;
  S.res={correct:correct,wrong:n-correct-unans,skipped:unans,pct:pct,earned:earned,time:Math.floor((Date.now()-S.t0)/1000)};
  var p=db.prog[S.sec.id]||{best:0,attempts:0,bestScore:0};
  p.attempts++;p.last=pct;
  if(pct>=p.best){p.best=pct;p.bestScore=correct;}
  db.prog[S.sec.id]=p;db.pts+=earned;save();
  result();
}
function msg(p){
  if(p>=90)return ['ممتاز! 🌟','مستواك رائع، واصل بنفس القوة.'];
  if(p>=75)return ['جيد جدًا 👏','أنت قريب من التميز، راجع الأسئلة الخاطئة.'];
  if(p>=60)return ['جيد 👍','اجتزت الاختبار، وبقليل من المراجعة سترتفع نتيجتك.'];
  return ['تحتاج إلى مراجعة 📚','راجع الشرح أدناه ثم أعد المحاولة، وستتحسن بإذن الله.'];
}
function result(){
  var r=S.res,m=msg(r.pct);
  var items=S.list.map(function(q,i){
    var a=S.ans[i],ok=a!==null&&q.o[a].ok;
    var right=q.o.filter(function(o){return o.ok;})[0].t;
    return '<details class="'+(ok?'good':'bad')+'"'+(ok?'':' open')+'><summary>'+(ok?'✅':(a===null?'⚪':'❌'))+' السؤال '+(i+1)+': '+fmt(q.q)+'</summary><div class="rv">'+
      (ok?'':'<div class="yours">'+(a===null?'لم تُجب عن هذا السؤال.':'إجابتك: '+fmt(q.o[a].t))+'</div>')+
      '<div class="right">الإجابة الصحيحة: '+fmt(right)+'</div><div>'+fmt(q.ex)+'</div></div></details>';
  }).join('');
  page('<main class="wrap"><section class="res"><div style="color:var(--g2);font-weight:800">'+S.sec.title+'</div>'+
    '<div class="ring" style="--p:'+r.pct+'"><div>'+r.pct+'%</div></div><h2>'+m[0]+'</h2><div style="color:var(--mut)">'+m[1]+'</div>'+
    '<div class="stats"><div class="stat"><b>'+r.correct+' / '+S.list.length+'</b><span>إجابات صحيحة</span></div><div class="stat"><b>'+r.wrong+'</b><span>خاطئة</span></div><div class="stat"><b>'+r.skipped+'</b><span>بلا إجابة</span></div><div class="stat"><b>'+mmss(r.time)+'</b><span>الزمن</span></div><div class="stat"><b>+'+r.earned+'</b><span>نقاط</span></div></div>'+
    '<div class="acts no-print"><button class="btn" data-act="retry">🔁 إعادة الاختبار</button><button class="btn alt" data-act="home">🏠 الرئيسية</button><button class="btn gold" data-act="mail">📧 إرسال النتيجة والتقرير للمعلم</button><button class="btn alt" data-act="copy">📋 نسخ التقرير</button>'+
    (r.pct>=60?'<button class="btn alt" data-act="cert">🎓 شهادة إنجاز</button>':'')+'</div></section>'+
    '<h3 style="margin:22px 0 4px">مراجعة الأسئلة</h3>'+items+'</main>');
}
function achievement(){
  var sum=0;SECTIONS.forEach(function(s){if(db.prog[s.id])sum+=db.prog[s.id].best;});
  return Math.round(sum/SECTIONS.length);
}
function level(p){return p>=90?'ممتاز':p>=75?'جيد جدًا':p>=60?'جيد':p>0?'يحتاج إلى مراجعة':'لم يبدأ بعد';}
function reportText(cur){
  var ach=achievement();
  var done=SECTIONS.filter(function(s){return db.prog[s.id]&&db.prog[s.id].best>=60;}).length;
  var t='السلام عليكم ورحمة الله،\n\nتقرير الطالب على منصة اختبارات تحصيلي الفيزياء\n\n'+
   'الطالب: '+db.user.name+'\nالجوال: '+db.user.phone+'\n\n';
  if(cur&&S&&S.res){
    var r=S.res;
    var w=S.list.map(function(q,i){return (S.ans[i]===null||!q.o[S.ans[i]].ok)?q.n:0;}).filter(Boolean).sort(function(a,b){return a-b;});
    t+='نتيجة الاختبار الحالي: '+S.sec.title+'\nالدرجة: '+r.correct+' من '+S.list.length+' ('+r.pct+'%)\nخاطئة: '+r.wrong+' | بلا إجابة: '+r.skipped+'\nالزمن: '+mmss(r.time)+' | النقاط: '+r.earned+'\nأرقام الأسئلة التي تحتاج مراجعة: '+(w.length?w.join('، '):'لا يوجد')+'\n\n';
  }
  t+='تقرير الإنجاز:\n';
  SECTIONS.forEach(function(s){
    var p=db.prog[s.id];
    t+='- '+s.title+': '+(p?('أفضل نتيجة '+p.best+'% ('+p.bestScore+'/'+s.qs.length+')، المحاولات '+p.attempts):'لم يُحل بعد')+'\n';
  });
  t+='\nدرجة الإنجاز الكلية: '+ach+'% ('+level(ach)+')\nالاختبارات المجتازة (60% فأكثر): '+done+' من '+SECTIONS.length+'\nمجموع النقاط: '+db.pts+'\nتاريخ الإرسال: '+new Date().toLocaleString('ar-SA')+'\n';
  return t;
}
function sendMail(cur){
  var sub=(cur&&S&&S.res?'نتيجة وتقرير '+S.sec.title:'تقرير إنجاز الطالب')+' - '+db.user.name;
  location.href='mailto:'+EMAIL+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(reportText(cur));
}
function flash(m){
  var d=document.createElement('div');
  d.textContent=m;
  d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14532d;color:#fff;padding:10px 20px;border-radius:12px;font-weight:700;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25)';
  document.body.appendChild(d);setTimeout(function(){d.remove();},2600);
}
function copyReport(cur){
  var t=reportText(cur);
  function fb(){
    var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';
    document.body.appendChild(a);a.select();
    var ok=false;try{ok=document.execCommand('copy');}catch(e){}
    a.remove();flash(ok?'تم نسخ التقرير ✔ — الصقه في رسالة بريد أو واتساب':'تعذر النسخ، استخدم زر الإرسال بالبريد');
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){flash('تم نسخ التقرير ✔ — الصقه في رسالة بريد أو واتساب');},fb);
  }else fb();
}
function cert(){
  var d=new Date().toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'});
  page('<main class="wrap"><div class="cert"><div style="font-size:3rem">🏅</div><h1>شهادة إنجاز</h1><p>تشهد منصة اختبارات تحصيلي الفيزياء بأن الطالب</p>'+
   '<div class="nm">'+esc(db.user.name)+'</div><p>قد اجتاز «'+S.sec.title+'» بنسبة <b>'+S.res.pct+'%</b> ('+S.res.correct+' من '+S.list.length+')</p>'+
   '<div class="sig"><div>التاريخ<br>'+d+'</div><div>'+esc(TEACHER)+'</div></div></div>'+
   '<div class="acts no-print"><button class="btn" data-act="print">🖨 طباعة / حفظ PDF</button><button class="btn alt" data-act="back">← رجوع للنتيجة</button></div></main>');
}

/* ---------- الأحداث ---------- */
var ACT={
  start:function(v){startQuiz(v);},
  pick:function(v){pick(+v);},
  next:function(){if(S.idx<S.list.length-1){S.idx++;quiz();}},
  prev:function(){if(S.idx>0){S.idx--;quiz();}},
  goto:function(v){S.idx=+v;quiz();},
  finish:function(){finish(false);},
  home:function(){home();},
  retry:function(){startQuiz(S.sec.id);},
  mail:function(){sendMail(true);},mailall:function(){sendMail(false);},
  copy:function(){copyReport(true);},copyall:function(){copyReport(false);},
  cert:cert,print:function(){window.print();},
  back:function(){result();},
  logout:function(){db.user=null;save();login();}
};
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t||t.disabled)return;
  var f=ACT[t.getAttribute('data-act')];
  if(f)f(t.getAttribute('data-v'));
});
app.addEventListener('change',function(e){
  if(e.target.id==='shuf'){db.shuffle=e.target.checked;save();}
});
app.addEventListener('submit',function(e){
  if(e.target.id!=='loginForm')return;
  e.preventDefault();
  var nm=document.getElementById('nm').value.trim().replace(/\s+/g,' ');
  var err=document.getElementById('err');
  var ph=normPhone(document.getElementById('ph').value);
  if(ACCESS.indexOf(ph)<0){err.textContent='رقم الدخول غير صحيح. أدخل رقم الجوال المعتمد للدخول.';return;}
  if(nm.split(' ').length<3){err.textContent='الرجاء كتابة الاسم الثلاثي كاملًا.';return;}
  db.user={name:nm,phone:ph};save();home();
});

if(db.user&&db.user.phone&&ACCESS.indexOf(db.user.phone)>=0)home();else login();
})();
</script>
</body>
</html>
